
name: Build Glass TV APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: launcher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            launcher/**/*.gradle*
            launcher/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Glass TV Release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/

      - name: Upload Glass TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-TV-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
